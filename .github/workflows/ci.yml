name: CI

on:
  push:
    branches: [main, developer]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (typecheck + testes com MongoDB)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Gerar .env do CI
        working-directory: .
        run: |
          ROOT_PASS=$(openssl rand -hex 24)
          APP_PASS=$(openssl rand -hex 24)
          JWT=$(openssl rand -hex 32)
          echo "::add-mask::$ROOT_PASS"
          echo "::add-mask::$APP_PASS"
          echo "::add-mask::$JWT"
          cat > .env <<EOF
          MONGO_ROOT_USER=root
          MONGO_ROOT_PASSWORD=$ROOT_PASS
          MONGO_DB=gestao_chamados
          MONGO_APP_USER=chamados_app
          MONGO_APP_PASSWORD=$APP_PASS
          MONGO_HOST_PORT=27018
          MONGODB_URI=mongodb://chamados_app:$APP_PASS@127.0.0.1:27018/gestao_chamados?authSource=gestao_chamados
          JWT_SECRET=$JWT
          JWT_EXPIRES_IN=15m
          PORT=3000
          CORS_ORIGIN=http://localhost:5173
          EOF
          chmod 600 .env

      - name: Subir MongoDB
        working-directory: .
        run: docker compose up -d --wait

      - run: npm ci
      - run: npm run typecheck
      - run: npm run db:check
      - run: npm test

      - name: Logs do MongoDB (se falhar)
        if: failure()
        working-directory: .
        run: docker compose logs mongo

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build
